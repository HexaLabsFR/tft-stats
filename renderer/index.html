<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https://raw.communitydragon.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
  <title>HexaRise</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" id="nav" aria-label="Navigation principale">
      <a class="rail-logo" data-route="meta" href="#meta" aria-label="HexaRise, accueil"><img src="logo.svg" alt=""></a>
      <a class="rail-item" data-route="meta" href="#meta">
        <span class="rail-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z"/></svg></span>Compos
      </a>
      <a class="rail-item" data-route="line" href="#line">
        <span class="rail-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 3-10.5 6"/></svg></span>Ligne
      </a>
      <a class="rail-item" data-route="game" href="#game">
        <span class="rail-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9h4M8 7v4M15 10h.01M18 8h.01M7 4h10a5 5 0 0 1 5 5v3a4 4 0 0 1-7 2.6L14 13h-4l-1 1.6A4 4 0 0 1 2 12V9a5 5 0 0 1 5-5z"/></svg></span>En jeu
      </a>
      <a class="rail-item" data-route="explore" href="#explore">
        <span class="rail-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg></span>Explorer
      </a>
      <a class="rail-item" data-route="learn" href="#learn">
        <span class="rail-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span>Apprendre
      </a>
      <a class="rail-item" data-route="player" href="#player">
        <span class="rail-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg></span>Profil
      </a>
      <a class="rail-item rail-bottom" data-route="settings" href="#settings">
        <span class="rail-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Réglages
      </a>
    </nav>

    <div class="main">
      <header class="topbar">
        <label class="searchbar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="sr">Rechercher</span>
          <input id="q" type="search" placeholder="Rechercher une compo, un champion, un objet…" autocomplete="off">
          <button class="live" id="live" data-action="refresh" type="button" title="Actualiser maintenant">
            <span class="dot"></span><span id="live-text">Initialisation…</span>
          </button>
        </label>
        <button class="update-banner hidden" id="update-banner" type="button"></button>
      </header>
      <div class="progress"><div class="bar" id="progress-bar"></div></div>
      <section class="view" id="view"></section>
      <footer class="foot">
        <span id="sample-label">—</span>
        <span>HexaRise par Hexa Labs · n'est pas approuvé par Riot Games et ne reflète pas les opinions de Riot Games.</span>
      </footer>
    </div>
  </div>

  <div class="boot" id="boot" role="status" aria-label="Chargement de HexaRise">
    <div class="boot-center">
      <img class="boot-logo" src="logo.svg" alt="">
      <div class="boot-name">HexaRise</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-msg">Chargement…</div>
    </div>
    <div class="hl-sign"><img src="brand/hexalabs-symbole-simple.svg" alt=""><span>par <b>Hexa Labs</b></span></div>
  </div>
  <div id="layer"></div>
  <div class="snackbar" id="snackbar" role="status" aria-live="polite"><span id="snack-text"></span><button type="button" id="snack-ok">OK</button></div>
  <div class="tooltip hidden" id="tooltip"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
