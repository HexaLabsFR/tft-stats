<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https://raw.communitydragon.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
  <title>HexaRise · Mode partie</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body class="ov">
  <header class="ov-bar">
    <span class="ov-dot" id="ov-dot" title="Partie TFT détectée"></span>
    <span class="ov-title" id="ov-title">Mode partie</span>
    <div class="ov-actions">
      <button class="ov-btn desktop-only" data-act="opacity-" title="Plus transparent">◐</button>
      <button class="ov-btn desktop-only" data-act="opacity+" title="Plus opaque">●</button>
      <button class="ov-btn desktop-only" data-act="main" title="Ouvrir HexaRise">⤢</button>
      <button class="ov-btn" data-act="close" title="Masquer">✕</button>
    </div>
  </header>
  <div class="ov-pick" id="ov-pick"></div>
  <nav class="ov-tabs" id="ov-tabs">
    <a class="chip hidden" data-tab="reco" id="ov-reco-tab">Reco</a>
    <a class="chip" data-tab="guide">Plan</a>
    <a class="chip" data-tab="levels">Niveaux</a>
    <a class="chip" data-tab="items">Objets</a>
    <a class="chip" data-tab="augs">Augments</a>
  </nav>
  <main class="ov-body" id="ov-body"></main>
  <footer class="ov-foot" id="ov-foot"></footer>
  <div class="tooltip hidden" id="tooltip"></div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
