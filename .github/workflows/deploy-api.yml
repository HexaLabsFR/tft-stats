name: Déployer HexaRise API

# Déploie le serveur de recherche de profil (Cloudflare Workers) puis publie son adresse
# dans api.json sur le site (branche site) : l'app la lit, sans nouvelle version.
# Secrets GitHub nécessaires : CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID.
# RIOT_API_KEY (clé de PRODUCTION uniquement) est envoyée au serveur si elle existe.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', 'core/riot.js', 'core/player.js', 'core/aggregate.js', '.github/workflows/deploy-api.yml']

permissions:
  contents: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_RIOT: ${{ secrets.RIOT_API_KEY != '' }}
    steps:
      - name: Secrets Cloudflare présents ?
        if: env.HAS_CF != 'true'
        run: echo "::notice::Ajoute les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour déployer HexaRise API."

      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version: 22

      - name: Déployer sur Cloudflare Workers
        id: deploy
        if: env.HAS_CF == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: '1'
          FORCE_COLOR: '0'
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.txt; then
            # Les messages d'erreur remontent en annotations (lisibles sans ouvrir les journaux).
            grep -E "ERROR|✘|rror|subdomain|register|Authentication|permission|code: " ../deploy.txt | head -15 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          fi
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' ../deploy.txt | head -1)
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::HexaRise API déployé : $URL"

      - name: Envoyer la clé Riot de production au serveur
        if: env.HAS_CF == 'true' && env.HAS_RIOT == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          NO_COLOR: '1'
        shell: bash
        run: printf '%s' "$RIOT_API_KEY" | npx --yes wrangler@4 secret put RIOT_API_KEY

      - name: Publier l'adresse du serveur pour l'app (api.json sur le site)
        if: env.HAS_CF == 'true' && steps.deploy.outputs.deployment-url != ''
        shell: bash
        run: |
          URL="${{ steps.deploy.outputs.deployment-url }}"
          echo "Serveur : $URL"
          curl -fsS "$URL/health" || true
          git fetch -q origin site
          git checkout -q -B site FETCH_HEAD
          printf '{\n  "profile": "%s"\n}\n' "$URL" > api.json
          if git diff --quiet -- api.json 2>/dev/null && git ls-files --error-unmatch api.json >/dev/null 2>&1; then echo "Adresse inchangée."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.json
          git commit -q -m "Adresse de HexaRise API"
          git push -q origin site
          echo "api.json publié sur le site."
