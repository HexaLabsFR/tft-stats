# Fabrique l'installeur Windows et le publie dans les Releases de ce dépôt.
# Se déclenche quand package.json change sur main (nouveau numéro de version),
# ou à la main depuis l'onglet Actions. electron-builder crée lui-même
# l'étiquette vX.Y.Z et ignore une version déjà publiée.
name: Publier une version

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Fabriquer et publier l'installeur
        run: npx electron-builder --win nsis --publish always
        env:
          # Jeton fourni automatiquement par GitHub, limité à ce dépôt.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
