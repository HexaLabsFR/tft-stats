# Fabrique l'installeur Windows et le publie dans les Releases de ce dépôt.
# Se déclenche à chaque étiquette de version (ex. v1.3.0).
name: Publier une version

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la Release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Vérifier que la version correspond à l'étiquette
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "package.json ($PKG) ne correspond pas à l'étiquette ($GITHUB_REF_NAME)"; exit 1
          fi

      - name: Fabriquer et publier l'installeur
        run: npx electron-builder --win nsis --publish always
        env:
          # Jeton fourni automatiquement par GitHub, limité à ce dépôt.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
