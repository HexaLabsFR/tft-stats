# Fabrique l'installeur Windows et le publie dans les Releases de ce dépôt.
# Se déclenche quand package.json change sur main (nouveau numéro de version),
# ou à la main depuis l'onglet Actions. Étapes : étiquette vX.Y.Z, fabrication,
# puis publication de tous les fichiers en une seule fois (évite les doublons).
name: Publier une version

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Créer l'étiquette de version
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Étiquette $TAG déjà présente"
          else
            git tag "$TAG" && git push origin "refs/tags/$TAG"
          fi

      - name: Fabriquer l'installeur
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis --publish never 2>&1 | tee build.log || {
            # Remonte la fin du journal en annotations (10 max par étape, lisibles sans ouvrir les logs).
            { grep -iE 'error|⨯|fail|cannot|denied|40[134]' build.log | tail -n 6; tail -n 4 build.log; } | sed -e 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Publier la version (tous les fichiers en une fois)
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La version $TAG existe déjà : augmente le numéro dans package.json."
            exit 1
          fi
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --title "HexaRise $TAG" --notes "Mise à jour automatique dans l'app." --latest
        env:
          # Jeton fourni automatiquement par GitHub, limité à ce dépôt.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
